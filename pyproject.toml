[project]
name = "citationinti"
version = "0.1.0"
description = "Scopus reference citation recommender backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "spacy>=3.7,<3.9",
    "torch>=2.4",
    "adapters>=1.2.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "openai>=1.40",
    "google-genai>=1.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "faker>=28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine is cached (lru_cache)
# and its pooled connections cannot survive a loop swap between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the docker-compose test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends/File/Query defaults are calls by design.
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
