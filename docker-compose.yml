services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: citation_db
    # Host port 5433: a pre-existing local PostgreSQL owns 5432 on this machine.
    # Bound to loopback only — never expose the DB port on all interfaces.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d citation_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredispass}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredispass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Everything below is profile "full": a server deploy (api + worker + web
  # in Docker), not local Mac dev. `make dev` only ever runs
  # `docker compose up -d postgres redis` (no profile), so it's unaffected
  # by anything here. Local models (SPECTER2/reranker) must run on the host
  # for MPS on a Mac -- never in Docker -- which is exactly what `make dev`
  # already does; this profile is for a Linux server instead.

  # One-shot: runs the schema up to head, then exits. api/worker wait on it
  # completing successfully rather than each racing to migrate themselves.
  migrate:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@postgres:5432/citation_db
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  api:
    profiles: ["full"]
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@postgres:5432/citation_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredispass}@redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@postgres:5432/citation_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredispass}@redis:6379/0
      # Belt-and-braces alongside torch.set_num_threads() in device.py --
      # OpenMP/MKL read these at import time, before a settings lookup or
      # torch.set_num_threads() could run.
      OMP_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # threads, not prefork: one process means one shared copy of SPECTER2 +
    # the cross-encoder (~1.5GB) rather than one per worker process, and it
    # puts device.py's CPU-limiting semaphore in the same process as the
    # models it's meant to serialize. The bottleneck two concurrent
    # analyses spend most of their time on is waiting on the LLM over the
    # network, which releases the GIL -- threads lose nothing there.
    # --concurrency here is the actual value; settings.celery_concurrency
    # just mirrors it for app code to reason about the CPU budget by.
    #
    # --beat embeds the scheduler in this same process rather than running
    # a separate beat container. Normally discouraged with multiple
    # workers (each would run its own beat and double-fire schedules) --
    # safe here because there is exactly one worker. It only ever fires
    # library.refresh, which is itself idle-checking and self-rescheduling
    # (see app/workers/tasks/refresh_library.py), so a missed or delayed
    # tick costs nothing beyond a later enrichment pass.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=2 --beat --schedule=/tmp/celerybeat-schedule

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      # A runtime `environment:` entry for API_ORIGIN would do nothing --
      # next build bakes the rewrite destination into
      # .next/routes-manifest.json, which `next start` just reads. It has
      # to be a build arg so it's present while `npm run build` runs.
      args:
        API_ORIGIN: http://api:8000
    ports:
      # Loopback-only, matching postgres/redis above -- lets you curl/debug
      # from the host itself, but this is not how the reverse proxy reaches
      # it (see the `networks:` block below for that).
      - "127.0.0.1:3100:3100"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - npm_proxy

networks:
  default: {}
  # Nginx Proxy Manager runs as its own separate Docker Compose project, so
  # it's on its own network by default and can't reach `web`'s loopback-only
  # port publish above -- `docker network connect`-ing it by hand works but
  # doesn't survive NPM's container being recreated. Joining `web` to NPM's
  # network here instead means NPM can always reach it at `http://web:3100`
  # (the Docker-internal service name, not the container name/hash), no
  # manual reconnect ever needed. Override NPM_NETWORK_NAME if your NPM
  # compose project isn't named "nginx_proxy_manager" (check with
  # `docker network ls` -- it defaults to `<project-dir>_default`).
  npm_proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx_proxy_manager_default}

volumes:
  postgres_data:
  uploads_data:
